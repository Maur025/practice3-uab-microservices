services:
  mariadb-people:
    image: mariadb:11
    container_name: mariadb-people
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root_password
      MARIADB_DATABASE: erp_people_db
      MARIADB_USER: erp_user
      MARIADB_PASSWORD: erp_password
    ports:
      - "3307:3306"
    volumes:
      - mariadb_people_data:/var/lib/mysql
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  erp-people:
    build:
      context: ./erp-people
      dockerfile: Dockerfile
    container_name: erp-people
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 7802
      SERVER_APP_PORT: 7802
      DB_HOST: mariadb-people
      DB_PORT: 3306
      DB_NAME: erp_people_db
      DB_USER: erp_user
      DB_PASSWORD: erp_password
      JWT_SECRET: erp-jwt-secret-change-me
      JWT_REFRESH_SECRET: erp-refresh-secret-change-me
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_SALT_ROUNDS: 12
    ports:
      - "7802:7802"
    depends_on:
      mariadb-people:
        condition: service_healthy
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7802/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  erp-gateway:
    build:
      context: ./erp-gateway
      dockerfile: Dockerfile
    container_name: erp-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 7800
      SERVER_APP_PORT: 7800
      SERVER_REDIRECTION: DOCKER
      PEOPLE_SERVICE_URL: http://erp-people:7802
    ports:
      - "7800:7800"
    depends_on:
      erp-people:
        condition: service_healthy
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7800/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  erp-network:
    driver: bridge

volumes:
  mariadb_people_data:
